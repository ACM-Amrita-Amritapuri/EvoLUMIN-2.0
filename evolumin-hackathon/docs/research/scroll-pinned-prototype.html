<!doctype html><meta name=viewport content="width=device-width"><style>
html{overflow-x:clip} body{margin:0;font:20px sans-serif}
.bar{position:fixed;top:0;left:0;height:4px;width:100%;background:red;transform-origin:0 50%;transform:scaleX(0);z-index:9}
@supports (animation-timeline:scroll()){.bar{animation:grow linear both;animation-timeline:scroll(root block)}}
@keyframes grow{to{transform:scaleX(1)}}
.rev{opacity:0;translate:0 60px}
@supports (animation-timeline:view()){.rev{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 60%}}
@keyframes rv{to{opacity:1;translate:0 0}}
@supports not (animation-timeline:view()){.rev{opacity:1;translate:none}}
.par{height:60vh;overflow:hidden;position:relative}.par i{position:absolute;inset:-20% 0;background:linear-gradient(blue,green)}
@supports (animation-timeline:view()){.par i{animation:px linear both;animation-timeline:view();animation-range:cover}}
@keyframes px{from{translate:0 -15%}to{translate:0 15%}}
.pin{height:400svh;content-visibility:visible}.pin>div{position:sticky;top:0;height:100svh;display:grid;place-items:center;background:#222;color:#fff}
.pin.cv{content-visibility:auto}
section{height:80vh}
</style><div class=bar></div><section>top</section>
<div class="rev" id=r style="height:200px;background:#ccc">reveal</div><section></section>
<div class=par><i></i></div><section></section>
<div class=pin id=pin><div>pinned</div></div><section id=end>end</section>
<script src=lenis.min.js></script><script>
window.L=new Lenis({anchors:true}); function raf(t){L.raf(t);requestAnimationFrame(raf)};requestAnimationFrame(raf)
</script>
