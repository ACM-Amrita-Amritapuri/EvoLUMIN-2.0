<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<style>html{background:#000}body{margin:0;color:#eee;font:16px system-ui}#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
section{height:100vh;display:grid;place-items:center;font-size:48px;font-weight:700}</style>
<canvas id=bg></canvas><section>Hero</section><section>About</section><section>Domains</section><section>Register</section>
<script>
const VS=`#version 300 es
layout(location=0)in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
uniform float uTime,uScroll;uniform vec2 uPointer,uResolution;out vec4 o;
float h(vec2 p){p=fract(p*vec2(.1031,.1030));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
const mat2 R=mat2(.8,.6,-.6,.8)*2.02;
float fbm(vec2 p,int N){float s=0.,a=.5;for(int i=0;i<5;i++){if(i>=N)break;s+=a*n(p);p=R*p;a*=.5;}return s;}
void main(){
  vec2 uv=gl_FragCoord.xy/uResolution;vec2 p=(gl_FragCoord.xy-.5*uResolution)/uResolution.y;
  float t=uTime*.05;
  p+=uPointer*.08;                       // soft pointer parallax
  p.y+=uScroll*1.5;                      // smoke drifts with scroll
  p*=1.6;
  vec2 q=vec2(fbm(p+vec2(0,t),3),fbm(p+vec2(5.2,1.3)-t,3));
  vec2 r=vec2(fbm(p+3.*q+vec2(1.7,9.2)+t*1.5,3),fbm(p+3.*q+vec2(8.3,2.8)-t,3));
  float f=clamp((fbm(p+3.*r,5)-.3)*2.2,0.,1.);   // fbm lives ~.3-.7: stretch to 0-1
  // two separate density fields (red, cyan) -> additive overlap gives clean magenta/white, never muddy
  float side=uv.x+.35*(r.x-.5)+.5*sin(uScroll*6.28318);          // spatial hue bias
  float wc=smoothstep(.2,.9,.5+.7*(side-.5)+(uScroll-.5)*.9);    // cyan weight, shifts per section
  float dr=smoothstep(.3,1.05,f*f*1.5+.3*(q.x-.5))*(1.-.8*wc);
  float dc=smoothstep(.3,1.05,f*1.3*(.3+r.y)+.2*(q.y-.5))*(.1+.9*wc);
  vec3 ember=vec3(1.,.09,.17), ion=vec3(.14,.75,1.);
  vec3 col=ember*dr*dr*1.5+vec3(.9,.25,.1)*pow(dr,5.)*.6      // hot core drifts orange, not pink
          +ion*dc*dc*1.9+vec3(.5,.9,1.)*pow(dc,5.)*.5;
  float v=1.-smoothstep(.35,1.1,length(uv-.5)*1.25);        // vignette keeps edges black for text
  col*=.12+.88*v; col*=.42;                                  // overall dim: it's a backdrop
  col=1.-exp(-col*1.5);   // per-channel exp tonemap keeps saturation (Reinhard greys it)
  col+=(h(gl_FragCoord.xy+uTime)-.5)/255.;                   // dither kills banding
  o=vec4(col,1.);
}`;
const c=document.getElementById('bg'),gl=c.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'low-power'});
const mk=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o};
const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,VS));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(p);gl.useProgram(p);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,0,0,0);
const U=n=>gl.getUniformLocation(p,n),uT=U('uTime'),uS=U('uScroll'),uP=U('uPointer'),uR=U('uResolution');
let S=.5,w=0,h=0,px=0,py=0,tx=0,ty=0;
function size(){w=c.width=Math.max(2,innerWidth*devicePixelRatio*S|0);h=c.height=Math.max(2,innerHeight*devicePixelRatio*S|0);gl.viewport(0,0,w,h);gl.uniform2f(uR,w,h)}
addEventListener('resize',size);size();
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth*2-1;ty=1-e.clientY/innerHeight*2},{passive:true});
let last=0,t0=performance.now();
function frame(now){requestAnimationFrame(frame);if(now-last<33)return;last=now;
  const m=document.documentElement.scrollHeight-innerHeight;px+=(tx-px)*.05;py+=(ty-py)*.05;
  gl.uniform1f(uT,(now-t0)/1000+(+new URLSearchParams(location.search).get('t')||0));gl.uniform1f(uS,m>0?scrollY/m:0);gl.uniform2f(uP,px,py);gl.drawArrays(gl.TRIANGLES,0,3)}
requestAnimationFrame(frame);
</script>
